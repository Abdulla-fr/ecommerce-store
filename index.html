<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">🛍️ ShopHub</div>
            <div class="nav-links">
                <a href="#home" class="nav-link active" onclick="showHome()">Home</a>
                <a href="#shop" class="nav-link" onclick="showShop()">Shop</a>
                <a href="#cart" class="nav-link" onclick="showCart()">Cart <span id="cartCount" class="cart-badge">0</span></a>
            </div>
        </div>
    </nav>

    <!-- Home Section -->
    <section id="home" class="section active">
        <div class="hero">
            <h1>Welcome to ShopHub</h1>
            <p>Your favorite online shopping destination</p>
            <button class="btn-primary" onclick="showShop()">Start Shopping</button>
        </div>
    </section>

    <!-- Shop Section -->
    <section id="shop" class="section">
        <div class="container">
            <h2>Our Products</h2>
            <div id="productsList" class="products-grid">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Cart Section -->
    <section id="cart" class="section">
        <div class="container">
            <h2>Shopping Cart</h2>
            <div class="cart-wrapper">
                <div id="cartItems" class="cart-items">
                    <!-- Cart items will be loaded here -->
                </div>
                <div class="cart-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping:</span>
                        <span id="shipping">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax:</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                    <button class="btn-primary" onclick="checkout()" id="checkoutBtn">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCheckout()">&times;</span>
            <h2>Checkout</h2>
            <form onsubmit="completeOrder(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label>ZIP Code</label>
                        <input type="text" id="zip" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Expiry Date</label>
                        <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" id="cvv" placeholder="123" maxlength="3" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Complete Order</button>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content success">
            <div class="success-icon">✓</div>
            <h2>Order Successful!</h2>
            <p id="orderMessage"></p>
            <button class="btn-primary" onclick="closeSuccess()">Continue Shopping</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 ShopHub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
